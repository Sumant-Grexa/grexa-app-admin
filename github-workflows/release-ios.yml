name: Release iOS

on:
  push:
    branches: [eng/prod_release_github_actions]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 2.36.1)"
        required: true
      release_notes:
        description: "What's new text"
        required: false
        default: ""
      rollout_type:
        description: "Release type: full | phased | manual"
        required: false
        default: "full"

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Set up iOS signing
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_PROVISIONING_PROFILE_NOTIFICATION: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFICATION }}
          IOS_PROVISIONING_PROFILE_CONTENT_EXT: ${{ secrets.IOS_PROVISIONING_PROFILE_CONTENT_EXT }}
        run: |
          # Create temp keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # Import certificate
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          # Install all provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE"              | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/main.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_NOTIFICATION" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/notification.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_CONTENT_EXT"  | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/content_ext.mobileprovision


      - name: Build IPA
        run: flutter build ipa --flavor prod -t lib/main_prod.dart

      - name: Set release vars
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "release_notes=${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "rollout_type=${{ inputs.rollout_type }}" >> $GITHUB_OUTPUT
          else
            echo "version=2.38.1" >> $GITHUB_OUTPUT
            echo "release_notes=Test build" >> $GITHUB_OUTPUT
            echo "rollout_type=full" >> $GITHUB_OUTPUT
          fi

      - name: Upload to App Store via Transporter
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          echo "$ASC_PRIVATE_KEY" > /tmp/AuthKey.p8
          xcrun transporter \
            -m upload \
            -f "build/ios/ipa/Runner.ipa" \
            -apiKey "$ASC_KEY_ID" \
            -apiIssuer "$ASC_ISSUER_ID"
          rm -f /tmp/AuthKey.p8

      - name: Submit to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          VERSION_STRING: ${{ steps.vars.outputs.version }}
          RELEASE_NOTES: ${{ steps.vars.outputs.release_notes }}
          ROLLOUT_TYPE: ${{ steps.vars.outputs.rollout_type }}
        run: node .github/scripts/asc-submit.mjs

      - name: Create Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.vars.outputs.version }}" -m "Release v${{ steps.vars.outputs.version }}" || true
          git push origin "v${{ steps.vars.outputs.version }}" || true
