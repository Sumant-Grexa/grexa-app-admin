name: Release iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 2.36.1)"
        required: true
      release_notes:
        description: "What's new text"
        required: false
        default: ""
      rollout_type:
        description: "Release type: full | phased | manual"
        required: false
        default: "full"

jobs:
  build-and-upload:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26 is not installed on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei 'iphoneos26|iOS 26'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create env files
        run: |
          echo "${{ secrets.ENV_DEV }}" > .env.dev
          echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Run build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: cd ios && pod install
      
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profiles
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}"              | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/main.mobileprovision
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFICATION }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/notification.mobileprovision
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_CONTENT_EXT }}"  | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/content_ext.mobileprovision

      - name: Set up iOS signing
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_PROVISIONING_PROFILE_NOTIFICATION: ${{ secrets.IOS_PROVISIONING_PROFILE_NOTIFICATION }}
          IOS_PROVISIONING_PROFILE_CONTENT_EXT: ${{ secrets.IOS_PROVISIONING_PROFILE_CONTENT_EXT }}
        run: |
          # Create temp keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # ✅ FIX 2: Register the keychain in the search list so codesign can see it.
          # Without this, certificates imported into build.keychain are invisible
          # to xcodebuild even though import succeeded.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          # Import certificate
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          # Install all provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE"              | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/main.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_NOTIFICATION" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/notification.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE_CONTENT_EXT"  | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/content_ext.mobileprovision

      - name: Set up Firebase config for prod
        run: |
          cp ios/flavors/prod/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist
          cp ios/flavors/prod/firebase_app_id_file.json ios/firebase_app_id_file.json

      # - name: Build IPA
      #   run: |
      #     flutter build ipa \
      #       --flavor prod \
      #       -t lib/main_prod.dart \
      #       --export-options-plist=ios/ExportOptions.plist
      
      - name: Build IPA
        run: |
          flutter build ipa \
            --flavor prod \
            -t lib/main_prod.dart \
            --export-options-plist=ios/ExportOptions.plist
        env:
          UPLOAD_SYMBOLS: 0

      - name: Upload Crashlytics dSYM symbols
        run: |
          DSYM_PATH=$(find build/ios/archive -name "*.dSYM" -type d | head -1 | xargs dirname)
          ios/Pods/FirebaseCrashlytics/upload-symbols \
            -gsp ios/Runner/GoogleService-Info.plist \
            -p ios \
            "$DSYM_PATH"

      - name: Set release vars
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "rollout_type=${{ inputs.rollout_type }}" >> $GITHUB_OUTPUT
            {
              echo "release_notes<<EOF"
              echo "${{ inputs.release_notes }}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "version=2.38.1" >> $GITHUB_OUTPUT
            echo "rollout_type=full" >> $GITHUB_OUTPUT
            {
              echo "release_notes<<EOF"
              echo "Test build"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Upload to App Store via altool
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcrun altool --upload-app \
            -f "build/ios/ipa/Grexa.ipa" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Submit to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          VERSION_STRING: ${{ steps.vars.outputs.version }}
          RELEASE_NOTES: ${{ steps.vars.outputs.release_notes }}
          ROLLOUT_TYPE: ${{ steps.vars.outputs.rollout_type }}
        run: node .github/scripts/asc-submit.mjs
