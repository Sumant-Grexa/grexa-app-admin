name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 2.36.1)"
        required: true
      release_notes:
        description: "What's new text"
        required: false
        default: ""
      track:
        description: "Play Store track"
        required: false
        default: "production"
      user_fraction:
        description: "Rollout percentage (1–100)"
        required: false
        default: "10"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set flavor
        run: bash scripts/set-flavor.sh prod

      - name: Build AAB
        run: flutter build appbundle --flavor prod -t lib/main_prod.dart

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: ai.grexa.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ inputs.track }}
          userFraction: ${{ format('{0}', inputs.user_fraction) }}
          whatsNewDirectory: whats-new/
          status: completed

      - name: Write What's New file
        if: inputs.release_notes != ''
        run: |
          mkdir -p whats-new
          echo "${{ inputs.release_notes }}" > whats-new/whatsnew-en-US

      - name: Create Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v${{ inputs.version }}" \
            -f target_commitish=master \
            | jq -r '.body' >> release-notes.md || true
