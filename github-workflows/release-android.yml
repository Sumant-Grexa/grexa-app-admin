name: Release Android

on:
  push:
    branches: [eng/prod_release_github_actions]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 2.36.1)"
        required: true
      release_notes:
        description: "What's new text"
        required: false
        default: ""
      track:
        description: "Play Store track"
        required: false
        default: "production"
      user_fraction:
        description: "Rollout percentage (1–100)"
        required: false
        default: "10"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build AAB
        run: flutter build appbundle --flavor prod -t lib/main_prod.dart

      - name: Set release vars
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "release_notes=${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "track=${{ inputs.track }}" >> $GITHUB_OUTPUT
            echo "user_fraction=${{ inputs.user_fraction }}" >> $GITHUB_OUTPUT
          else
            echo "version=2.38.1" >> $GITHUB_OUTPUT
            echo "release_notes=Test build" >> $GITHUB_OUTPUT
            echo "track=production" >> $GITHUB_OUTPUT
            echo "user_fraction=10" >> $GITHUB_OUTPUT
          fi

      - name: Write What's New file
        run: |
          mkdir -p whats-new
          echo "${{ steps.vars.outputs.release_notes }}" > whats-new/whatsnew-en-US

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: ai.grexa.app
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          track: ${{ steps.vars.outputs.track }}
          userFraction: ${{ steps.vars.outputs.user_fraction }}
          whatsNewDirectory: whats-new/
          status: completed

      - name: Create Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.vars.outputs.version }}" -m "Release v${{ steps.vars.outputs.version }}"
          git push origin "v${{ steps.vars.outputs.version }}"

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v${{ steps.vars.outputs.version }}" \
            -f target_commitish=master \
            | jq -r '.body' >> release-notes.md || true
